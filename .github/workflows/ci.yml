name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces, so superseded commits don't hold
# up the runners that every thread shares. Runs on main are never cancelled, so every merge is fully
# tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Database privacy tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: Browsers (Chrome and Safari)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start a local Supabase (real sign-in, emails go to Mailpit)
        run: npm run db:start
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Run in Chrome and Safari (desktop and phone)
        run: npm run test:e2e
      - name: Backup and restore drill (local data from the tests, never the live database)
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          BACKUP_PASSPHRASE: local-drill-passphrase-not-a-secret
        run: |
          # The test run leaves uploads in local Storage; the drill copies them with the local secret key.
          set -a; . ./.env.local; set +a
          export SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
          scripts/backup/backup.sh "$RUNNER_TEMP/backup"
          scripts/backup/restore.sh "$RUNNER_TEMP"/backup/*.gpg "$(scripts/backup/scratch-db.sh)"
      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  bug-fix-rules:
    name: Bug-fix rules
    # A fix for a bug report is held to scripts/bugs/policy.ts: what it may touch depends on who sent
    # the report. Passes for every other pull request. Uses main's copy of the rules, never the PR's.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      # Only reads the pull request's changes as text; none of its code runs here.
      - name: Fetch the pull request
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the fix against the rules
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f scripts/bugs/check-pr.ts ]; then
            node scripts/bugs/check-pr.ts
          else
            echo "::notice::main has no bug-fix rules yet (this pull request adds them), so there is nothing to check."
          fi

  concierge-guide:
    name: Concierge guide
    # Concierge, the help assistant, answers from lib/help/guide.ts. A pull request that adds new
    # screens or components (a new feature, usually) must update the guide too, or say in its
    # description "Guide: no change" when nothing people see is new. Bug fixes are exempt.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'bugfix/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: New screens come with guide changes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- app components | grep -E '\.tsx?$' | grep -vE '(^|/)(actions|route)\.ts$' || true)
          if [ -z "$added" ]; then echo "No new screens or components."; exit 0; fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qx 'lib/help/guide.ts'; then echo "The guide was updated."; exit 0; fi
          if printf '%s' "$PR_BODY" | grep -qi 'guide: no change'; then echo "Marked as needing no guide change."; exit 0; fi
          echo "::error::This pull request adds new screens or components but doesn't update lib/help/guide.ts, which Concierge answers from. Say there what the feature does and where to tap, or write 'Guide: no change' in the description if nothing people see is new."
          echo "$added"
          exit 1
