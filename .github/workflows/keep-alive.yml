name: Keep-alive and backup watchdog

# Every day:
#   1. Touches the live app and database so Supabase's free plan never pauses the project
#      (Vercel also does this daily, see vercel.json; either one is enough).
#   2. Checks that a good nightly backup happened in the last 36 hours. GitHub sometimes delays or
#      skips scheduled runs, so if it didn't, this starts one now and opens an issue.

on:
  schedule:
    - cron: "41 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.APP_URL || 'https://depai.vercel.app' }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Wake the app and the database
        run: |
          ok=false
          for i in 1 2 3; do
            if curl -fsS --max-time 30 "$APP_URL/api/keep-alive"; then ok=true; break; fi
            sleep 20
          done
          if [ -n "$DB_URL" ]; then psql "$DB_URL" -Atc "select 1" >/dev/null && ok=true; fi
          scripts/backup/record-check.sh keep_alive "$ok" "$( [ "$ok" = true ] && echo "App and database answered" || echo "No answer from $APP_URL or the database")"
          if [ "$ok" != true ]; then
            scripts/backup/alert.sh open keep-alive-failed "Depeche's database did not answer" \
              "The daily keep-alive could not reach $APP_URL/api/keep-alive or the database. Supabase may have paused the project: open https://supabase.com/dashboard and press Restore if it says Paused. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
          scripts/backup/alert.sh close keep-alive-failed "Fixed: the database answers again."
      - name: Check last night's backup actually ran
        # Backups run in the private repo (CodeMaster267/depeche-private), so this reads the
        # last verified backup from the live database instead of this repo's runs.
        run: |
          last=""
          if [ -n "$DB_URL" ]; then
            last=$(psql "$DB_URL" -Atc "select to_char(max(finished_at) at time zone 'utc', 'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"') from public.backup_runs where restore_verified")
          fi
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt $(( 36 * 3600 )) ]; then
            echo "Last good backup: $last"
            scripts/backup/alert.sh close backup-missing "Fixed: a good backup ran at $last."
            exit 0
          fi
          scripts/backup/alert.sh open backup-missing "No backup in the last 36 hours" \
            "The last verified backup was ${last:-never}. Open the private repo's Actions tab (CodeMaster267/depeche-private → Actions → Nightly backup) and press Run workflow."
