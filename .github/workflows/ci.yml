name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it replaces, so superseded commits
# don't use up GitHub Actions minutes (the repo is private: 2,000 free minutes a month). Runs on
# main are never cancelled, so every merge is fully tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Database privacy tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: Browsers (Chrome and Safari)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start a local Supabase (real sign-in, emails go to Mailpit)
        run: npm run db:start
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Run in Chrome and Safari (desktop and phone)
        run: npm run test:e2e
      - name: Backup and restore drill (local data from the tests, never the live database)
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          scripts/backup/backup.sh "$RUNNER_TEMP/backup"
          scripts/backup/restore.sh "$RUNNER_TEMP"/backup/*.tar.gz "$(scripts/backup/scratch-db.sh)"
      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  bug-fix-rules:
    name: Bug-fix rules
    # A fix for a bug report is held to scripts/bugs/policy.ts: what it may touch depends on who sent
    # the report. Passes for every other pull request. Uses main's copy of the rules, never the PR's.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      # Only reads the pull request's changes as text; none of its code runs here.
      - name: Fetch the pull request
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the fix against the rules
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f scripts/bugs/check-pr.ts ]; then
            node scripts/bugs/check-pr.ts
          else
            echo "::notice::main has no bug-fix rules yet (this pull request adds them), so there is nothing to check."
          fi
