name: Copy bug report text

# Lives in the PRIVATE repo CodeMaster267/depeche-private (copy kept in the app repo at
# ops/private-repo/). The app repo is public, so its bug-report issues hold only who sent a report
# and the page. This copies each report's text into an issue here, titled like the public one
# ("Bug report 1a2b3c4d"), half an hour after the public mirror runs. No AI and no API key.
#
# Secret: SUPABASE_DB_URL (the live database, same value as in the app repo).

on:
  schedule:
    - cron: "47 4 * * *" # 30 minutes after the public mirror (04:17 UTC)
  workflow_dispatch:

permissions: {}

concurrency:
  group: bug-report-text
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the database secret is set
        id: ready
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL is not set, so no reports were read."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          repository: CodeMaster267/depeche
          ref: main
          persist-credentials: false
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy new reports' text
        if: steps.ready.outputs.go == 'true'
        run: node scripts/bugs/private-copy.ts
