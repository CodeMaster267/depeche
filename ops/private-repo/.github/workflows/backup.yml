name: Nightly backup

# Lives in the PRIVATE repo CodeMaster267/depeche-private (copy kept in the app repo at
# ops/private-repo/), because the app repo is public and anyone signed in to GitHub can download a
# public repo's artifacts. It checks out the app repo's main branch for the scripts.
#
# Every night: dump the live database (and any Storage files), restore it into a separate empty
# database and check every table and file, then keep the file as a private artifact of this run for
# 30 days, then GitHub deletes it. Nothing older is kept, so anything a person deletes in Depeche is
# gone from every backup within 30 days. Nothing is committed to git. Not encrypted (Hasan,
# 2026-11-04): only people with access to this private repo can download it.
#
# If anything fails, an issue is opened (GitHub emails it to Hasan); the next good run closes it.
# The app repo's keep-alive.yml checks every day (in backup_runs) that this actually ran.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL            the live database (same value as in the app repo)
#   SUPABASE_SERVICE_ROLE_KEY  only needed once the app stores files (images, documents)
#
# To restore: see docs/backups.md.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$DB_URL" ] || missing="$missing SUPABASE_DB_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. No backup was made."
            exit 1
          fi
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "stamp=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: CodeMaster267/depeche  # the app's public repo: scripts only, no secrets in it
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Back up
        run: scripts/backup/backup.sh "$RUNNER_TEMP/backup"
      - name: Start a separate, empty database
        run: echo "RESTORE_DB=$(scripts/backup/scratch-db.sh)" >> "$GITHUB_ENV"
      - name: Restore the file into it and check every table and file
        run: RESTORE_REPORT="$RUNNER_TEMP/restore-report.json" scripts/backup/restore.sh "$RUNNER_TEMP/backup/depeche-backup-$stamp.tar.gz" "$RESTORE_DB"
      - name: Keep the backup (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: depeche-backup-${{ env.stamp }}-run${{ github.run_number }}
          path: ${{ runner.temp }}/backup/depeche-backup-${{ env.stamp }}.tar.gz
          retention-days: 30  # never longer: deleted chats must leave every backup within 30 days
          compression-level: 0
          if-no-files-found: error
      - name: Record the verified backup in the live database
        run: |
          size=$(wc -c < "$RUNNER_TEMP/backup/depeche-backup-$stamp.tar.gz")
          read -r tables rows files < <(node -e 'const r = require(process.argv[1]); console.log(r.tables, r.rows, r.files)' "$RUNNER_TEMP/restore-report.json")
          psql "$DB_URL" -v ON_ERROR_STOP=1 --quiet \
            -v name="depeche-backup-$stamp" -v started="$started_at" -v size="$size" -v tables="$tables" \
            -v rows="$rows" -v files="$files" -v url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" <<'SQL'
          insert into public.backup_runs (backup_name, started_at, size_bytes, tables, rows, files, restore_verified, run_url)
          values (:'name', :'started', :size, :tables, :rows, :files, true, :'url');
          SQL
      - name: Show it on the Health screen
        run: |
          size=$(wc -c < "$RUNNER_TEMP/backup/depeche-backup-$stamp.tar.gz")
          read -r rows files < <(node -e 'const r = require(process.argv[1]); console.log(r.rows, r.files)' "$RUNNER_TEMP/restore-report.json")
          scripts/backup/record-check.sh backup true "$stamp, $(numfmt --to=iec "$size")B, kept 30 days in the private repo"
          scripts/backup/record-check.sh restore_test true "$stamp: $rows rows and $files file(s) restored into a separate database and matched"

  alert:
    needs: backup
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CodeMaster267/depeche  # the app's public repo: scripts only, no secrets in it
          ref: main
          persist-credentials: false
      - name: Show the failure on the Health screen
        run: |
          scripts/backup/record-check.sh backup false "$(date -u +%Y-%m-%d): backup failed, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Open an issue (GitHub emails Hasan)
        run: |
          scripts/backup/alert.sh open backup-failed "Last night's backup failed" \
            "The nightly backup on $(date -u +%Y-%m-%d) failed, so no new copy was saved. Older copies are still kept. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  all-clear:
    needs: backup
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CodeMaster267/depeche  # the app's public repo: scripts only, no secrets in it
          ref: main
          persist-credentials: false
      - name: Close any open backup alert
        run: |
          scripts/backup/alert.sh close backup-failed "Fixed: tonight's backup worked and its restore test passed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
